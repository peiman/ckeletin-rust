# gitleaks configuration — secret scanning (CKSPEC-ENF-001).
#
# Framework-owned: this file is replaced on `just ckeletin-update`. To add
# project-specific allowlist entries without losing them on update, create a
# root-level `.gitleaks.toml`:
#
#   [extend]
#   path = ".ckeletin/configs/gitleaks.toml"
#
# `just ckeletin-secrets`, the lefthook pre-commit, and the secret-scan CI job
# pass that root file to `--config` when it exists. Otherwise they pass this
# file. `.gitleaksignore` applies to whichever config is selected.
#
# The two scans do not share one fingerprint. `gitleaks git` (CI and the
# pre-commit hook) uses `commit:file:rule:line`. `gitleaks dir`
# (`just ckeletin-secrets`) uses `file:rule:line`. An ignore line for one
# does not cover the other. Add both forms when a finding is a false positive.
#
# A finding already in history keeps failing `gitleaks git` until that commit's
# fingerprint is in `.gitleaksignore`, or the history is rewritten. The scan
# does not drop old findings on its own.
#
# Used by `just ckeletin-secrets` and the secret-scan CI job. Extends gitleaks'
# built-in ruleset rather than replacing it.
title = "ckeletin gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Framework-level allowlist"
# Never scan build output or VCS internals — they contain no source secrets and
# scanning them is slow (target/ alone is ~1 GB).
paths = [
    '''(^|/)target/''',
    '''(^|/)\.git/''',
]
